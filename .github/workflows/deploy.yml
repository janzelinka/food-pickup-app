name: Deploy Laravel to Azure App Service

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZ_CREDENTIALS }}

      # 3. Deploy code to App Service
      # This copies the repo to /home/site/wwwroot
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: pb-chlebicky-awgfndh6byiqq
          slot-name: production
          package: .

      # 4. Install Composer dependencies via SSH
      - name: Install Composer dependencies
        run: |
          az webapp ssh \
            --resource-group PBChlebickyRG \
            --name pb-chlebicky-awgfndh6byiqq \
            --command "cd /home/site/wwwroot/app && composer install --no-dev --optimize-autoloader --no-interaction"

      # 5. Run Laravel migrations
      - name: Run Laravel migrations
        run: |
          az webapp ssh \
            --resource-group PBChlebickyRG \
            --name pb-chlebicky-awgfndh6byiqq \
            --command "cd /home/site/wwwroot && php artisan migrate --force"

      # 6. Optimize Laravel
      - name: Optimize Laravel
        run: |
          az webapp ssh \
            --resource-group PBChlebickyRG \
            --name pb-chlebicky-awgfndh6byiqq \
            --command "cd /home/site/wwwroot && php artisan config:clear && php artisan config:cache && php artisan route:cache"
