name: Deploy Laravel to Azure App Service

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup PHP + Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      # 3. Install Composer dependencies (locally in CI)
      - name: Install Composer dependencies
        run: |
          cd app && composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction

      # 4. Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 5. Deploy built app (with vendor/)
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: my-laravel-app
          package: .

      # 6. Run migrations via SSH
      - name: Run Laravel migrations
        run: |
          az webapp ssh \
            --resource-group PBChlebickyRG \
            --name pb-chlebicky-awgfndh6byiqq \
            --command "cd /home/site/wwwroot && php artisan migrate --force"
